# Production/testing compose for a single EC2 box behind CloudFront.
# Media is served from a real public S3 bucket (see .env.production), so MinIO
# is intentionally absent. Postgres/Redis are internal only — no host ports.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api npm run migration:run:prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # loopback only — reach via SSH tunnel, never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # No host port — reachable only on the compose network as "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Only override the in-cluster service hosts. S3_* (including S3_ENDPOINT)
    # come straight from .env and point at the real AWS S3 bucket.
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${PORT:-3000}:3000" # CloudFront origin → this port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
